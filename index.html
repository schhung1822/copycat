<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Copycat AI</title>

    <!--
      Tailwind chạy qua CDN (Play CDN) như bản gốc của dự án: không cần bước build CSS.
      Nếu sau này cần tối ưu tốc độ tải, cài tailwindcss vào dự án và bỏ thẻ script này.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                500: '#E60023', // đỏ Pinterest
                600: '#ad081b',
              },
              dark: {
                950: '#0a0a0a',
                900: '#121212',
                850: '#1a1a1a',
                800: '#252525',
                700: '#2C2C2C',
              },
            },
          },
        },
      };
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0a0a0a;
        color: #e0e0e0;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1a1a;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #e60023;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
